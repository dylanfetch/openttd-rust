name: Migration task
description: Propose a bounded C++ to Rust migration task
title: "[Migration]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe a migration task taken from docs/roadmap.md. The original game is the behavioral specification; preserve observed behavior, including quirks. Keep the whole issue to about 60 lines.
  - type: input
    id: attribution
    attributes:
      label: Agent attribution
      description: For an agent-authored issue, identify the agent, exact model, and reasoning effort. Human authors may enter "Human".
      placeholder: "Agent: /root/implementation | Model: gpt-6.1-sol | Reasoning effort: high"
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Task owner
      description: Identify the agent or person responsible for the implementation and its draft PR targeting rust-migration.
    validations:
      required: true
  - type: input
    id: roadmap
    attributes:
      label: Roadmap item
      description: The docs/roadmap.md phase and item this implements. Work outside the roadmap needs root to update the roadmap first.
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Component or coupled group
      description: Name the C++ component(s) proposed for migration.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Ownership boundary
      description: The state and control flow Rust will own, the C++ facade and callbacks that remain, and a budget for new C++ glue lines.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence plan
      description: The simulation-harness scenarios that exercise this component (existing or to add) and the relevant existing tests. Name any concrete gap that needs a narrow comparison instead.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Behavior and FFI risks
      description: Identify observable behavior, state, ownership, ABI, or FFI risks, including quirks that must remain unchanged.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: State the behavior evidence, integration, and checks required before accepting the replacement.
    validations:
      required: true

name: Install OpenGFX
description: Reuse the OpenGFX 0.6.0 archive and install its baseset files
runs:
  using: composite
  steps:
    - name: Restore OpenGFX archive
      id: archive
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/opengfx-0.6.0-all.zip
        key: opengfx-0.6.0-${{ runner.os }}

    - name: Download and validate OpenGFX archive
      if: steps.archive.outputs.cache-hit != 'true'
      shell: bash
      run: |
        archive="$RUNNER_TEMP/opengfx-0.6.0-all.zip"
        curl --fail --location --retry 3 --retry-all-errors \
          https://cdn.openttd.org/opengfx-releases/0.6.0/opengfx-0.6.0-all.zip \
          --output "$archive"
        unzip -tq "$archive"

    - name: Save validated OpenGFX archive
      if: steps.archive.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/opengfx-0.6.0-all.zip
        key: ${{ steps.archive.outputs.cache-primary-key }}

    - name: Validate and install OpenGFX
      shell: bash
      run: |
        archive="$RUNNER_TEMP/opengfx-0.6.0-all.zip"
        unzip -tq "$archive"

        case "$RUNNER_OS" in
          Linux) destination="$HOME/.local/share/openttd/baseset" ;;
          macOS) destination="$HOME/Documents/OpenTTD/baseset" ;;
          Windows) destination='C:/Users/Public/Documents/OpenTTD/baseset' ;;
          *) echo "Unsupported runner OS: $RUNNER_OS" >&2; exit 1 ;;
        esac

        mkdir -p "$destination"
        unzip -o "$archive" -d "$destination"

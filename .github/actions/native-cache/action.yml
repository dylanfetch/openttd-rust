name: Native compiler cache
description: Restore or trim and publish the bounded native compiler family
inputs:
  save:
    description: Save instead of restore
    default: 'false'
  writer:
    description: Fixed protected writer route
    default: 'false'
  prefix:
    description: Previously computed compatibility prefix when saving
    default: ''
outputs:
  prefix:
    description: Compatibility prefix
    value: ${{ steps.identity.outputs.prefix }}
runs:
  using: composite
  steps:
  - id: identity
    if: inputs.save != 'true'
    shell: bash
    run: |
      python3 - <<'PY'
      import json
      import os
      from pathlib import Path
      import sys
      sys.path.insert(0, "tools")
      import migration
      identity = migration.compiler_cache_compatibility()
      Path(".local").mkdir(exist_ok=True)
      Path(".local/compiler-cache-identity.json").write_text(json.dumps(identity, indent=2) + "\n")
      with open(os.environ["GITHUB_OUTPUT"], "a") as output:
          output.write(f"prefix={identity['prefix']}\n")
      PY
  - if: inputs.save != 'true'
    uses: ./.github/actions/bounded-compiler-cache
    with:
      writer: ${{ inputs.writer }}
      family: native
      prefix: ${{ steps.identity.outputs.prefix }}
      paths: |
        .local/compiler-cache/reference
        .local/compiler-cache/candidate
  - if: inputs.save == 'true'
    shell: bash
    run: |
      for role in reference candidate; do
        CCACHE_DIR="$GITHUB_WORKSPACE/.local/compiler-cache/$role" CCACHE_MAXSIZE=750M ccache --cleanup
      done
  - if: inputs.save == 'true'
    uses: ./.github/actions/bounded-compiler-cache
    with:
      operation: publish
      writer: ${{ inputs.writer }}
      family: native
      prefix: ${{ inputs.prefix }}
      paths: |
        .local/compiler-cache/reference
        .local/compiler-cache/candidate

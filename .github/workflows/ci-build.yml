name: CI - Build

on:
  workflow_call:
    inputs:
      checkout-ref:
        required: true
        type: string
      profile:
        required: true
        type: string
    outputs:
      validated:
        description: All selected builds and annotation checks succeeded
        value: ${{ jobs.complete.outputs.validated }}
  pull_request:
  push:
    branches:
    - master
    - rust-migration

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

env:
  CTEST_OUTPUT_ON_FAILURE: 1

concurrency:
  group: ${{ github.workflow }}-build-${{ inputs.checkout-ref && github.run_id || github.ref == 'refs/heads/rust-migration' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/rust-migration' }}

jobs:
  policy:
    if: inputs.checkout-ref == ''
    uses: ./.github/workflows/ci-policy.yml

  emscripten:
    needs: policy
    if: ${{ !cancelled() && (inputs.checkout-ref != '' || needs.policy.outputs.heavy == 'true') && inputs.profile != 'native' }}
    name: Emscripten

    uses: ./.github/workflows/ci-emscripten.yml
    with:
      checkout-ref: ${{ inputs.checkout-ref }}

  linux:
    needs: policy
    if: ${{ !cancelled() && (inputs.checkout-ref != '' || needs.policy.outputs.heavy == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Clang
          compiler: clang
          cxxcompiler: clang++
          libraries: libsdl2-dev
        - name: GCC - SDL2
          compiler: gcc
          cxxcompiler: g++
          libraries: libsdl2-dev
        - name: GCC - Dedicated
          compiler: gcc
          cxxcompiler: g++
          libraries: grfcodec
          extra-cmake-parameters: -DOPTION_DEDICATED=ON -DCMAKE_CXX_FLAGS_INIT="-DRANDOM_DEBUG" -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON
          # Compile without SDL / SDL2, as that should compile fine too.

    name: Linux (${{ matrix.name }})

    uses: ./.github/workflows/ci-linux.yml

    with:
      checkout-ref: ${{ inputs.checkout-ref }}
      compiler: ${{ matrix.compiler }}
      cxxcompiler: ${{ matrix.cxxcompiler }}
      libraries: ${{ matrix.libraries }}
      extra-cmake-parameters: ${{ matrix.extra-cmake-parameters }}

  macos:
    needs: policy
    if: ${{ !cancelled() && (inputs.checkout-ref != '' || needs.policy.outputs.heavy == 'true') && inputs.profile != 'native' }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: arm64 - Debug
          arch: arm64
          full_arch: arm64
          extra-cmake-parameters: -DCMAKE_BUILD_TYPE=Debug -DOPTION_USE_ASSERTS=ON
        - name: arm64 - Release
          arch: arm64
          full_arch: arm64
          extra-cmake-parameters: -DCMAKE_BUILD_TYPE=RelWithDebInfo -DOPTION_USE_ASSERTS=OFF

    name: Mac OS (${{ matrix.name }})

    uses: ./.github/workflows/ci-macos.yml

    with:
      checkout-ref: ${{ inputs.checkout-ref }}
      rust: true
      arch: ${{ matrix.arch }}
      full_arch: ${{ matrix.full_arch }}
      extra-cmake-parameters: ${{ matrix.extra-cmake-parameters }}

  windows:
    needs: policy
    if: ${{ !cancelled() && (inputs.checkout-ref != '' || needs.policy.outputs.heavy == 'true') && inputs.profile != 'native' }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86
        - arch: x64

    name: Windows (${{ matrix.arch }})

    uses: ./.github/workflows/ci-windows.yml

    with:
      checkout-ref: ${{ inputs.checkout-ref }}
      rust: true
      arch: ${{ matrix.arch }}

  check_annotations:
    name: Check Annotations
    needs:
    - emscripten
    - linux
    - macos
    - windows

    if: always() && (inputs.checkout-ref != '' || (github.event_name == 'pull_request' && needs.linux.result != 'skipped'))

    runs-on: ubuntu-latest

    steps:
    - name: Check annotations
      uses: OpenTTD/actions/annotation-check@v6

  complete:
    if: always() && inputs.checkout-ref != ''
    needs: [emscripten, linux, macos, windows, check_annotations]
    runs-on: ubuntu-latest
    outputs:
      validated: ${{ steps.complete.outputs.validated }}
    steps:
    - id: complete
      env:
        PROFILE: ${{ inputs.profile }}
        RESULTS: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PY'
        import json
        import os
        results = json.loads(os.environ['RESULTS'])
        required = ['linux', 'check_annotations']
        if os.environ['PROFILE'] in ('platform', 'full'):
            required += ['emscripten', 'macos', 'windows']
        elif os.environ['PROFILE'] != 'native':
            raise SystemExit('Unsupported platform profile')
        failed = [job for job in required if results.get(job, {}).get('result') != 'success']
        if failed:
            raise SystemExit(f'Required builds/checks did not succeed: {failed}')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('validated=true\n')
        PY

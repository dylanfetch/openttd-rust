name: CI (Linux)

# Inherit the explicit caller cache ceiling; never over-request in a reusable worker.

on:
  workflow_call:
    inputs:
      cache-family:
        required: false
        type: string
        default: ''
      protected-writer:
        required: false
        type: boolean
        default: false
      checkout-ref:
        required: false
        type: string
        default: ""
      cache-only:
        required: false
        type: boolean
        default: false
      compiler:
        required: true
        type: string
      cxxcompiler:
        required: true
        type: string
      libraries:
        required: true
        type: string
      extra-cmake-parameters:
        required: true
        type: string

env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  linux:
    concurrency:
      group: ${{ inputs.protected-writer && format('protected-cache-{0}', inputs.cache-family) || format('cache-reader-linux-{0}-{1}-{2}', github.run_id, inputs.compiler, inputs.extra-cmake-parameters) }}
      cancel-in-progress: false
      queue: max
    name: CI
    if: ${{ (!inputs.cache-only || inputs.compiler != 'clang') && (inputs.protected-writer || inputs.compiler == 'clang' || inputs.checkout-ref != '' || github.event_name != 'push' || github.ref != 'refs/heads/rust-migration') }}

    runs-on: ${{ vars.CI_LINUX_PLATFORM || 'ubuntu-24.04' }}
    env:
      CC: ${{ inputs.compiler }}
      CXX: ${{ inputs.cxxcompiler }}

    steps:
    - name: Require immutable protected writer source
      if: inputs.protected-writer
      shell: bash
      env:
        CACHE_FAMILY: ${{ inputs.cache-family }}
        CHECKOUT_REF: ${{ inputs.checkout-ref }}
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
      run: |
        case "$CACHE_FAMILY" in linux-sdl2|linux-dedicated) ;; *) exit 1 ;; esac
        test -z "$CHECKOUT_REF"
        test "$EVENT" = push
        test "$REF" = refs/heads/rust-migration

    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.protected-writer && github.sha || inputs.checkout-ref }}
        persist-credentials: false
        fetch-depth: 1

    # Keep the Clang build's upstream PCH coverage; cache both GCC flavours.
    - name: Identify compiler cache
      if: inputs.compiler != 'clang'
      id: compiler-image
      env:
        EXTRA_CMAKE_PARAMETERS: ${{ inputs.extra-cmake-parameters }}
      run: |
        echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
        echo "flavour=$(printf '%s' "$EXTRA_CMAKE_PARAMETERS" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

    - name: Restore compiler cache
      if: inputs.compiler != 'clang'
      id: compiler-cache
      continue-on-error: ${{ inputs.protected-writer }}
      uses: ./.github/actions/bounded-compiler-cache
      with:
        writer: ${{ inputs.protected-writer }}
        family: ${{ inputs.cache-family }}
        prefix: ccache-linux-v2-${{ inputs.compiler }}-${{ steps.compiler-image.outputs.flavour }}-${{ steps.compiler-image.outputs.version }}-${{ hashFiles('migration/ccache.conf') }}
        paths: ${{ runner.temp }}/ccache

    - name: Setup vcpkg
      id: vcpkg
      uses: OpenTTD/actions/setup-vcpkg@v6

    - name: Install dependencies
      run: |
        echo "::group::Update apt"
        sudo apt-get update
        echo "::endgroup::"

        echo "::group::Install dependencies"
        sudo apt-get install -y --no-install-recommends \
          ccache \
          liballegro4-dev \
          libcurl4-openssl-dev \
          libfontconfig-dev \
          libharfbuzz-dev \
          libicu-dev \
          liblzma-dev \
          liblzo2-dev \
          libogg-dev \
          libopus-dev \
          libopusfile-dev \
          ${{ inputs.libraries }} \
          zlib1g-dev \
          # EOF

        echo "::group::Install vcpkg dependencies"

        # Disable vcpkg integration, as we mostly use system libraries.
        mv vcpkg.json vcpkg-disabled.json

        # We only use breakpad from vcpkg, as its CMake files
        # are a bit special. So the Ubuntu's variant doesn't work.
        ${{ steps.vcpkg.outputs.vcpkg }} install breakpad

        echo "::endgroup::"
      env:
        DEBIAN_FRONTEND: noninteractive

    - name: Install OpenGFX
      uses: ./.github/actions/install-opengfx

    - name: Install GCC problem matcher
      uses: ammaraskar/gcc-problem-matcher@master

    - name: Build
      env:
        CCACHE_CONFIGPATH: ${{ github.workspace }}/migration/ccache.conf
        CCACHE_DIR: ${{ runner.temp }}/ccache
        CCACHE_MAXSIZE: 600M
        CCACHE_BASEDIR: ${{ github.workspace }}
      run: |
        mkdir build
        cd build

        echo "::group::CMake"
        cache_parameters=()
        if [ "${{ inputs.compiler }}" != clang ]; then
          cache_parameters=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON)
          ccache -z
        fi
        cmake .. -DCMAKE_TOOLCHAIN_FILE=${{ runner.temp }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
          ${{ inputs.extra-cmake-parameters }} "${cache_parameters[@]}"
        echo "::endgroup::"

        echo "::group::Build"
        echo "Running on $(nproc) cores"
        cmake --build . -j $(nproc)
        echo "::endgroup::"
        if [ "${{ inputs.compiler }}" != clang ]; then
          ccache -sv
        fi

    - name: Restore the dependency manifest
      run: mv vcpkg-disabled.json vcpkg.json

    - name: Test
      if: ${{ !inputs.cache-only }}
      run: |
        (
          cd build
          ctest -j $(nproc) --timeout 120
        )

        # Check no tracked files have been modified.
        git diff --exit-code

    - name: Trim compiler cache
      if: inputs.compiler != 'clang' && inputs.protected-writer
      env:
        CCACHE_CONFIGPATH: ${{ github.workspace }}/migration/ccache.conf
        CCACHE_DIR: ${{ runner.temp }}/ccache
        CCACHE_MAXSIZE: 600M
      run: ccache --cleanup

    - name: Save compiler cache
      if: inputs.compiler != 'clang' && inputs.protected-writer && steps.compiler-cache.outcome == 'success'
      id: cache-publication
      continue-on-error: true
      uses: ./.github/actions/bounded-compiler-cache
      with:
        operation: publish
        writer: 'true'
        family: ${{ inputs.cache-family }}
        prefix: ccache-linux-v2-${{ inputs.compiler }}-${{ steps.compiler-image.outputs.flavour }}-${{ steps.compiler-image.outputs.version }}-${{ hashFiles('migration/ccache.conf') }}
        paths: ${{ runner.temp }}/ccache

    - name: Require successful bounded publication
      if: always() && inputs.protected-writer
      shell: bash
      env:
        RESTORE: ${{ steps.compiler-cache.outcome }}
        PUBLICATION: ${{ steps.cache-publication.outcome }}
      run: |
        test "$RESTORE" = success
        test "$PUBLICATION" = success

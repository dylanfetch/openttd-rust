name: Migration baseline validation

on:
  push:
    branches: [rust-migration]
  pull_request:
    branches: [rust-migration]
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout-ref:
        required: true
        type: string
    outputs:
      validated:
        description: All migration validation steps succeeded
        value: ${{ jobs.compare.outputs.validated }}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-migration-${{ inputs.checkout-ref && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/rust-migration' }}

jobs:
  policy:
    if: inputs.checkout-ref == ''
    uses: ./.github/workflows/ci-policy.yml

  compare:
    needs: policy
    if: always() && (inputs.checkout-ref != '' || needs.policy.outputs.heavy == 'true')
    outputs:
      validated: ${{ steps.validated.outputs.validated }}
    runs-on: ubuntu-24.04
    # Raised from 45 when #62 added the packet comparison (run 37102176363 hit 45 min
    # before #80 cached builds and parallelised comparisons).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false
      - name: Install uv for Ruff
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
      - name: Check Python tools with Ruff
        run: |
          uvx --from ruff==0.16.8 ruff check tools/
          uvx --from ruff==0.16.8 ruff format --check tools/
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache ninja-build libsdl2-dev liblzma-dev libpng-dev \
            libcurl4-openssl-dev libfreetype-dev libfontconfig-dev libharfbuzz-dev \
            libicu-dev liblzo2-dev openttd-opengfx
      - name: Install pinned Rust compiler and checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import tomllib
          toolchain = tomllib.loads(Path("rust-toolchain.toml").read_text())["toolchain"]
          subprocess.run([
              "rustup", "toolchain", "install", toolchain["channel"],
              "--profile", toolchain["profile"],
              "--component", ",".join(toolchain["components"]),
          ], check=True)
          PY
      - name: Verify compiler-cache controls
        run: python3 tools/test-compiler-cache.py
      - name: Check simulation runtime provenance
        run: python3 tools/test-simulation-provenance.py
      - name: Identify compatible compilation artifacts
        id: compiler-cache-identity
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, "tools")
          import migration
          identity = migration.compiler_cache_compatibility()
          Path(".local").mkdir(exist_ok=True)
          Path(".local/compiler-cache-identity.json").write_text(json.dumps(identity, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"prefix={identity['prefix']}\n")
          PY
      - name: Restore compatible compilation artifacts
        id: compiler-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            .local/compiler-cache/reference
            .local/compiler-cache/candidate
          key: ${{ steps.compiler-cache-identity.outputs.prefix }}-${{ inputs.checkout-ref || github.sha }}
          restore-keys: ${{ steps.compiler-cache-identity.outputs.prefix }}-
      # The driver requires cargo fmt/check/clippy/test before native builds.
      - name: Build native Rust generators without the game
        run: |
          python3 tools/migration.py tools --jobs 4 --ccache
      - name: Report port metrics
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          {
            echo "### Port metrics (tools/port-metrics.py)"
            python3 tools/port-metrics.py --target "origin/${{ github.base_ref }}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check Rust and compare original and migration builds
        run: |
          python3 tools/migration.py verify --jobs 4 --ccache
      - name: Compare migrated components with the pinned original
        run: python3 tools/run-comparisons.py --jobs 4
      - name: Compare simulation state with the pinned original
        # Reuses the builds from verify; see tools/simulate.py for scenarios and masks.
        run: python3 tools/simulate.py --jobs 4
      - name: Save validated protected-branch compilation artifacts
        if: success() && inputs.checkout-ref == '' && github.ref == 'refs/heads/rust-migration' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.compiler-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .local/compiler-cache/reference
            .local/compiler-cache/candidate
          key: ${{ steps.compiler-cache-identity.outputs.prefix }}-${{ inputs.checkout-ref || github.sha }}
      - name: Retain comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-evidence
          path: |
            .local/compiler-cache-identity.json
            .local/simulation/
            .local/verification/
            .local/comparison-logs/
            .local/*-comparison/
          include-hidden-files: true
      - name: Record complete migration validation
        id: validated
        run: echo 'validated=true' >> "$GITHUB_OUTPUT"

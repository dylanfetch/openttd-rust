name: Migration baseline validation

# Only the protected cache writer grants cache upload access.
cache-mode: read

on:
  pull_request:
    branches: [rust-migration]
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout-ref:
        required: true
        type: string
    outputs:
      validated:
        description: Every native build, component comparison and simulation shard succeeded
        value: ${{ jobs.complete.outputs.validated }}

permissions:
  contents: read
  pull-requests: read
  statuses: read

concurrency:
  group: ${{ github.workflow }}-migration-${{ inputs.checkout-ref && github.run_id || github.ref == 'refs/heads/rust-migration' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/rust-migration' }}

jobs:
  policy:
    if: inputs.checkout-ref == ''
    uses: ./.github/workflows/ci-policy.yml

  build:
    needs: policy
    if: ${{ !cancelled() && (inputs.checkout-ref != '' || needs.policy.outputs.heavy == 'true') }}
    cache-mode: read
    uses: ./.github/workflows/ci-native-build.yml
    with:
      checkout-ref: ${{ inputs.checkout-ref }}
      covered: ${{ needs.policy.outputs.covered == 'true' }}

  validation:
    needs: [policy, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && (inputs.checkout-ref != '' || needs.policy.outputs.heavy == 'true') }}
    cache-mode: read
    uses: ./.github/workflows/ci-native-validation.yml
    with:
      checkout-ref: ${{ inputs.checkout-ref || github.sha }}
      shards: ${{ needs.build.outputs.shards }}

  complete:
    needs: [policy, build, validation]
    if: ${{ always() && (inputs.checkout-ref != '' || needs.policy.outputs.heavy == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      validated: ${{ steps.complete.outputs.validated }}
    steps:
    - id: complete
      env:
        BUILD: ${{ needs.build.result }}
        VALIDATION: ${{ needs.validation.result }}
        VALIDATED: ${{ needs.validation.outputs.validated }}
      run: |
        test "$BUILD" = success
        test "$VALIDATION" = success
        test "$VALIDATED" = true
        echo 'validated=true' >> "$GITHUB_OUTPUT"

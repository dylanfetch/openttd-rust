name: CI scheduling policy

# Only the protected cache writer grants cache upload access.
cache-mode: read

on:
  workflow_call:
    outputs:
      heavy:
        description: Whether automatic native and platform validation should run
        value: ${{ jobs.policy.outputs.heavy }}
      covered:
        description: Whether the pushed merged tree already passed full validation
        value: ${{ jobs.policy.outputs.covered }}

permissions:
  contents: read
  pull-requests: read
  statuses: read

jobs:
  policy:
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.policy.outputs.heavy }}
      covered: ${{ steps.policy.outputs.covered }}
    steps:
    - id: policy
      uses: actions/github-script@v7
      env:
        CI_ON_DEMAND: ${{ vars.CI_ON_DEMAND }}
      with:
        script: |
          // Keep the old required contexts until root installs the merge gate.
          if (process.env.CI_ON_DEMAND !== 'true') {
            core.setOutput('heavy', 'true');
            return;
          }
          if (context.eventName === 'pull_request') {
            core.setOutput('heavy', String(context.payload.pull_request.base.ref !== 'rust-migration'));
            return;
          }
          if (context.eventName !== 'push' || /^0+$/.test(context.payload.before)) {
            core.setOutput('heavy', 'true');
            return;
          }
          const comparison = await github.rest.repos.compareCommitsWithBasehead({
            ...context.repo, basehead: `${context.payload.before}...${context.sha}`
          });
          // GitHub caps comparison files at 300: fail closed if the list may be truncated.
          const files = comparison.data.files || [];
          const docsOnly = files.length > 0 && files.length < 300 && files.every(file =>
            file.filename.endsWith('.md') && (!file.previous_filename || file.previous_filename.endsWith('.md')));
          if (docsOnly) {
            core.info('Markdown-only push: skip native/platform builds');
            core.setOutput('heavy', 'false');
            return;
          }
          const {data: pushed} = await github.rest.repos.getCommit({...context.repo, ref: context.sha});
          const tree = pushed.commit.tree.sha;
          const pulls = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
            ...context.repo, commit_sha: context.sha, per_page: 100
          });
          for (const pull of pulls) {
            if (!pull.merged_at || pull.base.ref !== 'rust-migration') continue;
            const {data: combined} = await github.rest.repos.getCombinedStatusForRef({
              ...context.repo, ref: pull.head.sha
            });
            const full = combined.statuses.find(status => status.context === 'Full validation');
            const covered = combined.statuses.find(status => status.context === 'Validated tree');
            if (full?.state === 'success' && covered?.state === 'success' &&
                full.target_url === covered.target_url && covered.description === tree) {
              core.info(`Merged tree ${tree} already passed full validation; refresh caches only`);
              core.setOutput('heavy', 'false');
              core.setOutput('covered', 'true');
              return;
            }
          }
          core.info('Uncovered tree: retain post-merge validation');
          core.setOutput('heavy', 'true');

name: Bound compilation caches

# Publication and deletion belong to each locked family writer, never a janitor.
cache-mode: read

on:
  workflow_run:
    workflows: [Protected migration validation, CI - Protected Build]
    types: [requested, completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: protected-compilation-cache-audit
  cancel-in-progress: false
  queue: max

jobs:
  audit:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'rust-migration'
    runs-on: ubuntu-latest
    steps:
    # workflow_run uses the trusted default-branch definition and immutable SHA.
    # This read-only audit accepts neither candidate code nor candidate artifacts.
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/github-script@v7
      with:
        script: |
          const policy = require(`${process.env.GITHUB_WORKSPACE}/tools/cache_policy.cjs`);
          const caches = await github.paginate(github.rest.actions.getActionsCacheList, {
            ...context.repo, per_page: 100
          });
          const snapshot = policy.inventory(caches);
          const peak = (2 * Object.values(policy.policy.families).reduce((sum, size) => sum + size, 0)
            + policy.policy.other_mib) * 1024 ** 2;
          core.info(`Cache list: ${snapshot.bytes} bytes; hard peak envelope ${peak}`);
          if (snapshot.bytes > peak) core.setFailed('Repository cache peak envelope exceeded');

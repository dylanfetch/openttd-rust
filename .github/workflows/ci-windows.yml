name: CI (Windows)

# Inherit the explicit caller cache ceiling; never over-request in a reusable worker.

on:
  workflow_call:
    inputs:
      protected-writer:
        required: false
        type: boolean
        default: false
      checkout-ref:
        required: false
        type: string
        default: ""
      cache-only:
        required: false
        type: boolean
        default: false
      arch:
        required: true
        type: string
      rust:
        required: false
        type: boolean
        default: false

env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  windows:
    concurrency:
      group: ${{ inputs.protected-writer && format('protected-cache-msvc-{0}', inputs.arch) || format('cache-reader-msvc-{0}-{1}', github.run_id, inputs.arch) }}
      cancel-in-progress: false
      queue: max
    name: CI

    # The pinned breakpad dependency uses stdext::checked_array_iterator,
    # which newer Visual Studio standard libraries removed.
    runs-on: windows-2022

    steps:
    - name: Require immutable protected writer source
      if: inputs.protected-writer
      shell: bash
      env:
        CHECKOUT_REF: ${{ inputs.checkout-ref }}
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
      run: |
        test -z "$CHECKOUT_REF"
        test "$EVENT" = push
        test "$REF" = refs/heads/rust-migration

    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.protected-writer && github.sha || inputs.checkout-ref }}
        persist-credentials: false

    - name: Setup vcpkg
      id: vcpkg
      uses: OpenTTD/actions/setup-vcpkg@v6

    - name: Install OpenGFX
      uses: ./.github/actions/install-opengfx

    - name: Install MSVC problem matcher
      uses: ammaraskar/msvc-problem-matcher@master

    - name: Configure developer command prompt for ${{ inputs.arch }}
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ inputs.arch }}
        vsversion: '2022'

    - name: Setup Python for Rust evidence
      if: inputs.rust
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install pinned Rust and selected target
      if: inputs.rust
      shell: bash
      run: |
        case "${{ inputs.arch }}" in
          x86) rust_target=i686-pc-windows-msvc ;;
          x64) rust_target=x86_64-pc-windows-msvc ;;
          *) echo "Unsupported protected architecture"; exit 1 ;;
        esac
        channel=$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
        rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy --target "$rust_target"
        echo "RUST_TARGET=$rust_target" >> "$GITHUB_ENV"
        echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
        mkdir -p .local/windows-evidence
        rustc -vV | tee .local/windows-evidence/rustc.txt
        rustup target list --installed --toolchain "$channel" | tee .local/windows-evidence/installed-targets.txt

    - name: Check actual cache archive admission on this platform
      if: inputs.rust && !inputs.cache-only
      shell: bash
      run: python tools/test-ci.py CacheTests.test_actual_sdk_compressor_stream_and_file_outputs_are_capped_before_upload

    - name: Rust checks for actual selected target
      if: inputs.rust && !inputs.cache-only
      shell: bash
      run: |
        # Git Bash prepends its unrelated link.exe; use the configured MSVC tools.
        export PATH="$(dirname "$(command -v cl.exe)"):$PATH"
        python tools/test-windows-rust-evidence.py
        cargo fmt --all -- --check
        cargo check --workspace --all-targets --locked --target "$RUST_TARGET"
        cargo clippy --workspace --all-targets --locked --target "$RUST_TARGET" -- -D warnings
        cargo test --workspace --locked --target "$RUST_TARGET"

    - name: Identify runner image
      id: runner-image
      shell: bash
      run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

    # vcpkg names each cached binary by its ABI hash (port version, triplet,
    # compiler), so a stale entry is never reused; it simply misses. A new
    # runner image (new compiler) gets a new key so its rebuilt binaries persist.
    - name: Restore vcpkg binary cache
      id: vcpkg-binary-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/vcpkg-binary-cache
        key: vcpkg-bin-${{ inputs.arch }}-${{ hashFiles('vcpkg.json') }}-${{ steps.runner-image.outputs.version }}
        restore-keys: |
          vcpkg-bin-${{ inputs.arch }}-${{ hashFiles('vcpkg.json') }}-

    # MSVC caching needs embedded /Z7 debug info and no PCH; ccache hashes the
    # compiler binary, arguments, INCLUDE environment and every included header.
    - name: Install ccache
      if: inputs.rust
      shell: bash
      run: |
        v=4.14.1
        curl -fsSL -o ccache.zip "https://github.com/ccache/ccache/releases/download/v$v/ccache-$v-windows-x86_64.zip"
        echo "6219f3865ca59aec41ee4b678df171d5d35855ecb2b6dbbbd20690b3a68af7b4  ccache.zip" | sha256sum -c -
        unzip -q -j ccache.zip "ccache-$v-windows-x86_64/ccache.exe" -d "$RUNNER_TEMP/ccache-bin"
        rm ccache.zip
        echo "CCACHE_EXE=$(cygpath -m "$RUNNER_TEMP/ccache-bin/ccache.exe")" >> "$GITHUB_ENV"

    - name: Restore compiler cache
      if: inputs.rust
      id: compiler-cache
      continue-on-error: ${{ inputs.protected-writer }}
      uses: ./.github/actions/bounded-compiler-cache
      with:
        writer: ${{ inputs.protected-writer }}
        family: msvc-${{ inputs.arch }}
        prefix: ccache-msvc-v1-${{ inputs.arch }}-${{ steps.runner-image.outputs.version }}-${{ hashFiles('migration/ccache.conf') }}
        paths: ${{ runner.temp }}/ccache

    - name: Build
      shell: bash
      env:
        NINJA_STATUS: "[%f/%t -- %e] " # [finished_edges/total_edges -- elapsed_time], default value is "[%f/%t] "
        # Upstream setup configures a Packages feed this fork does not maintain;
        # use a local files cache persisted by actions/cache instead.
        VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/vcpkg-binary-cache,readwrite
        CCACHE_CONFIGPATH: ${{ github.workspace }}/migration/ccache.conf
        CCACHE_DIR: ${{ runner.temp }}/ccache
        CCACHE_MAXSIZE: 1G
      run: |
        export PATH="$(dirname "$(command -v cl.exe)"):$PATH"
        rust_parameters=()
        if [ "${{ inputs.rust }}" = true ]; then
          rust_parameters=(-DOPTION_RUST=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo -DOPTION_USE_ASSERTS=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
            -DCMAKE_C_COMPILER_LAUNCHER="$CCACHE_EXE" -DCMAKE_CXX_COMPILER_LAUNCHER="$CCACHE_EXE"
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded)
          "$CCACHE_EXE" -z
        fi
        echo "::group::CMake"
        cmake -S . -B build \
          -GNinja \
          -DVCPKG_TARGET_TRIPLET=${{ inputs.arch }}-windows-static \
          -DCMAKE_TOOLCHAIN_FILE="${{ steps.vcpkg.outputs.vcpkg-cmake }}" \
          "${rust_parameters[@]}"
        echo "::endgroup::"

        echo "::group::Build"
        if [ "${{ inputs.rust }}" = true ]; then
          cmake --build build --parallel 4 -- -d keeprsp
          mkdir -p .local/windows-evidence
          { "$CCACHE_EXE" --show-config; "$CCACHE_EXE" -sv; } | tee .local/windows-evidence/ccache-stats.txt
        else
          cmake --build build
        fi
        echo "::endgroup::"

    - name: Trim compiler cache
      if: inputs.rust && inputs.protected-writer
      shell: bash
      env:
        CCACHE_CONFIGPATH: ${{ github.workspace }}/migration/ccache.conf
        CCACHE_DIR: ${{ runner.temp }}/ccache
        CCACHE_MAXSIZE: 1G
      run: '"$CCACHE_EXE" --cleanup'

    - name: Save compiler cache
      if: inputs.rust && inputs.protected-writer && steps.compiler-cache.outcome == 'success'
      id: cache-publication
      continue-on-error: true
      uses: ./.github/actions/bounded-compiler-cache
      with:
        operation: publish
        writer: 'true'
        family: msvc-${{ inputs.arch }}
        prefix: ccache-msvc-v1-${{ inputs.arch }}-${{ steps.runner-image.outputs.version }}-${{ hashFiles('migration/ccache.conf') }}
        paths: ${{ runner.temp }}/ccache

    - name: Test
      if: ${{ !inputs.cache-only }}
      shell: bash
      run: |
        cd build
        ctest --show-only=json-v1 > ctest-inventory.json
        python -c 'import json; tests=json.load(open("ctest-inventory.json"))["tests"]; assert tests, "Empty test inventory"; print(f"Discovered {len(tests)} tests")'
        ctest --timeout 120 --output-junit ctest.xml

    - name: Fresh Rust native generators
      if: inputs.rust && !inputs.cache-only
      shell: bash
      env:
        VCPKG_BINARY_SOURCES: clear
      run: |
        export PATH="$(dirname "$(command -v cl.exe)"):$PATH"
        cmake -S . -B .local/build-tools-windows -GNinja \
          -DOPTION_TOOLS_ONLY=ON -DOPTION_RUST=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DOPTION_USE_ASSERTS=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
          -DVCPKG_TARGET_TRIPLET=${{ inputs.arch }}-windows-static \
          -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/build/vcpkg_installed" \
          -DCMAKE_TOOLCHAIN_FILE="${{ steps.vcpkg.outputs.vcpkg-cmake }}"
        cmake --build .local/build-tools-windows --target tools --parallel 4 -- -d keeprsp

    - name: Validate refusals and actual archive freshness
      if: inputs.rust && !inputs.cache-only
      shell: bash
      env:
        VCPKG_BINARY_SOURCES: clear
      run: |
        export PATH="$(dirname "$(command -v cl.exe)"):$PATH"
        python tools/check-windows-rust-configurations.py --tools .local/build-tools-windows --output .local/windows-evidence

    - name: Record native CRT ABI linkage and fresh outputs
      if: inputs.rust && !inputs.cache-only
      shell: bash
      run: |
        export PATH="$(dirname "$(command -v cl.exe)"):$PATH"
        python tools/windows-rust-evidence.py --target "$RUST_TARGET" --build build --tools .local/build-tools-windows --output .local/windows-evidence

    - name: Retain native Windows Rust and test evidence
      if: always() && inputs.rust && !inputs.cache-only
      uses: actions/upload-artifact@v4
      with:
        name: windows-rust-${{ inputs.arch }}-evidence
        include-hidden-files: true
        path: |
          .local/windows-evidence/
          build/ctest-inventory.json
          build/ctest.xml
          build/Testing/Temporary/LastTest.log
          build/CMakeCache.txt
          build/CMakeFiles/CMakeConfigureLog.yaml
          build/compile_commands.json
          build/rust-*.log
          build/rust-*.txt
          build/*.map
          .local/build-tools-windows/CMakeCache.txt
          .local/build-tools-windows/CMakeFiles/CMakeConfigureLog.yaml
          .local/build-tools-windows/compile_commands.json
          .local/build-tools-windows/rust-*.log
          .local/build-tools-windows/rust-*.txt
          .local/build-tools-windows/*.map

    - name: Retain dependency and configure failure logs
      if: failure() && !inputs.cache-only
      uses: actions/upload-artifact@v4
      with:
        name: windows-vcpkg-${{ inputs.arch }}-logs
        path: |
          ${{ steps.vcpkg.outputs.vcpkg-location }}/buildtrees/**/*.log
          build/vcpkg-manifest-install.log
          build/CMakeFiles/CMakeConfigureLog.yaml

    - name: Require successful bounded publication
      if: always() && inputs.protected-writer
      shell: bash
      env:
        RESTORE: ${{ steps.compiler-cache.outcome }}
        PUBLICATION: ${{ steps.cache-publication.outcome }}
      run: |
        test "$RESTORE" = success
        test "$PUBLICATION" = success

[workspace]
members = ["rust/openttd-kernels"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "GPL-2.0-only"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
overflow-checks = true

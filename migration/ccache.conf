# Shared compilation reuse. ccache hashes compiler content, arguments and every
# included file; the driver sets base_dir per role so worktrees share entries.
# sloppiness and remote_storage stay at their empty defaults (the driver checks
# this); ccache 4.14 misparses an explicit empty remote_storage line.
compiler_check = content
direct_mode = true
depend_mode = false
hash_dir = false
max_size = 5G
